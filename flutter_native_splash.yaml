# Native splash configuration.
#
# Generate platform splash assets with:
#   flutter pub run flutter_native_splash:create
#
# Re-run after changing the logo or color so Android/iOS launch screens
# render the brand image immediately on cold start — covering Dart VM
# init and the first frame paint without dropping back to a white screen.

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0F172A"
  image: assets/logos/logo_light.png
  image_dark: assets/logos/logo_dark.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#0F172A"
    image: assets/logos/logo_light.png
    image_dark: assets/logos/logo_dark.png
  android: true
  ios: true
  web: false
  android_gravity: center
  ios_content_mode: center
  fullscreen: false
