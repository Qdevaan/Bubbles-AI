# Production stack for Bubbles Brain API v5.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Required on the host: a `.env` file with all secrets (see .env.example),
# plus DOMAIN and ACME_EMAIL for Caddy.

services:
  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server --appendonly yes
      --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: ghcr.io/${GHCR_OWNER:-bubbles}/bubbles-server:${TAG:-latest}
    depends_on:
      redis:
        condition: service_healthy
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  server:
    image: ghcr.io/${GHCR_OWNER:-bubbles}/bubbles-server:${TAG:-latest}
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    expose: ["8000"]

  worker:
    image: ghcr.io/${GHCR_OWNER:-bubbles}/bubbles-worker:${TAG:-latest}
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379/0

  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  redis_data:
  caddy_data:
  caddy_config:
