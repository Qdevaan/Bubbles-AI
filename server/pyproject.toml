[project]
name = "bubbles"
version = "5.0.0"
description = "Bubbles Brain API v5 — async FastAPI server for Bubbles-AI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Bubbles-AI Team" }]

dependencies = [
    # Web
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "gunicorn>=23.0,<24.0",
    "starlette>=0.41,<0.42",
    "python-multipart>=0.0.20,<0.1",
    "orjson>=3.10,<4.0",
    "msgspec>=0.18,<0.19",

    # Settings + validation
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",

    # Database
    "asyncpg>=0.30,<0.31",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "supabase>=2.10,<3.0",

    # Cache + jobs + ratelimit
    "redis[hiredis]>=5.2,<6.0",
    "arq>=0.26,<0.27",
    "cachetools>=5.5,<6.0",

    # HTTP + auth + crypto
    "httpx[http2]>=0.28,<0.29",
    "pyjwt[crypto]>=2.10,<3.0",
    "blake3>=1.0,<2.0",
    "tenacity>=9.0,<10.0",

    # Templating
    "jinja2>=3.1,<4.0",

    # AI providers
    "google-generativeai>=0.8,<0.9",
    "cerebras-cloud-sdk>=1.20,<2.0",
    "groq>=0.13,<0.14",

    # Voice
    "livekit-api>=0.8,<1.0",
    "edge-tts>=6.1,<7.0",
    "websockets>=14.1,<15.0",

    # Domain libs
    "language-tool-python==2.8.0",
    "networkx>=3.4,<4.0",
    "firebase-admin>=6.6,<7.0",

    # Observability
    "structlog>=24.4,<25.0",
    "sentry-sdk[fastapi]>=2.19,<3.0",
    "prometheus-client>=0.21,<0.22",
    "opentelemetry-api>=1.29,<2.0",
    "opentelemetry-sdk>=1.29,<2.0",
    "opentelemetry-exporter-otlp>=1.29,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-asyncpg>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "opentelemetry-instrumentation-redis>=0.50b0",

    # Time + ids
    "python-dateutil>=2.9,<3.0",
    "ulid-py>=1.1,<2.0",
]

[project.optional-dependencies]
embed-local = [
    "onnxruntime>=1.20,<2.0",
    "tokenizers>=0.21,<0.22",
    "numpy>=2.1,<3.0",
]
stt-local = [
    "faster-whisper>=1.1,<2.0",
]
speaker-id = [
    "speechbrain>=1.0,<2.0",
    "torch>=2.5,<3.0",
    "torchaudio>=2.5,<3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<0.9",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7.0",
    "pytest-recording>=0.13,<0.14",
    "pytest-mock>=3.14,<4.0",
    "hypothesis>=6.122,<7.0",
    "testcontainers[postgres,redis]>=4.9,<5.0",
    "respx>=0.22,<0.23",
    "freezegun>=1.5,<2.0",
    "fakeredis[lua]>=2.26,<3.0",
    "asgi-lifespan>=2.1,<3.0",
    "locust>=2.32,<3.0",
    "pre-commit>=4.0,<5.0",
    "ipython>=8.30,<9.0",
    "types-python-dateutil>=2.9,<3.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bubbles"]

[tool.hatch.build.targets.wheel.force-include]
"src/bubbles/ai/prompts" = "bubbles/ai/prompts"

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
[tool.uv]
package = true
default-groups = ["dev"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",        # pycodestyle / pyflakes
    "I",                  # isort
    "N",                  # pep8-naming
    "UP",                 # pyupgrade
    "B",                  # bugbear
    "C4",                 # comprehensions
    "ASYNC",              # async correctness
    "S",                  # bandit
    "T20",                # flake8-print (no print)
    "PIE",
    "RET",
    "SIM",
    "TID",
    "PTH",
    "ERA",
    "RUF",
]
ignore = [
    "E501",   # line length handled by formatter
    "S101",   # asserts ok in tests
    "B008",   # FastAPI Depends() pattern
    "N818",   # we use bare exception names: NotFound, BadRequest, etc.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20", "ERA", "UP017"]
"scripts/**" = ["T20", "S311"]  # load-test scripts don't need crypto RNG
"src/bubbles/core/ratelimit.py" = ["S105"]  # Lua script triple-quoted block
"src/bubbles/db/repo/**" = ["S608"]  # constants used in f-strings, never user input

[tool.ruff.lint.isort]
known-first-party = ["bubbles"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = [
    "language_tool_python.*",
    "edge_tts.*",
    "livekit.*",
    "cerebras.*",
    "groq.*",
    "google.generativeai.*",
    "firebase_admin.*",
    "networkx.*",
    "speechbrain.*",
    "torchaudio.*",
    "faster_whisper.*",
    "supabase.*",
    "arq.*",
    "asyncpg",
    "asyncpg.*",
    "cachetools",
    "cachetools.*",
    "ulid",
    "ulid.*",
    "fakeredis",
    "fakeredis.*",
    "testcontainers",
    "testcontainers.*",
    "docker",
    "docker.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--cov=bubbles",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-fail-under=0",
]
markers = [
    "integration: requires Postgres + Redis containers",
    "e2e: hits real external services",
    "slow: takes more than 1 s",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources.*",
]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src/bubbles"]
omit = ["src/bubbles/workers/jobs/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
