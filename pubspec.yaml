name: bubbles
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  share_plus: ^12.0.2
  pdf: ^3.11.1
  flutter_animate: ^4.5.0
  google_fonts: ^8.1.0
  supabase_flutter: ^2.8.1
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_markdown_plus: ^1.0.3
  intl: ^0.20.2
  url_launcher: ^6.3.1
  livekit_client: ^2.2.1
  permission_handler: ^12.0.1
  web_socket_channel: ^3.0.3
  record: ^6.1.2
  flutter_dotenv: ^6.0.1
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  porcupine_flutter: ^4.0.0
  audioplayers: ^6.5.1
  path_provider: ^2.1.5
  flutter_voice_processor: ^1.1.2
  flutter_sound: ^9.2.13
  connectivity_plus: ^7.0.0
  flutter_image_compress: ^2.4.0
  force_directed_graphview: ^0.6.2
  device_info_plus: ^12.3.0
  package_info_plus: ^9.0.0
  fl_chart: ^1.2.0
  provider: ^6.1.5+1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  crypto: ^3.0.3
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  webview_flutter: ^4.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "tools/logo_sources/logo_light.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - env/.env
    - assets/logos/
    - assets/text/
    - assets/wake_word/

  # Manrope is bundled locally so the app never fetches it from the
  # google_fonts CDN. The four TTFs cover every weight used in the UI;
  # w800 callers fall through to bundled Bold (w700) until an ExtraBold
  # cut is added.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
